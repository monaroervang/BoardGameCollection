services:
  gateway:
    build: ./Gateway
    environment:
      ASPNETCORE_URLS: http://+:5000
      ReverseProxy__Clusters__authCluster__Destinations__auth__Address: "http://authenticationservice:5000/"
    ports:
      - "8080:5000"
    depends_on:
      - authenticationservice
  
  authenticationservice:
    build: ./AuthenticationService
    environment:
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: "Server=usersdb;Port=3306;Database=usersdb;User=authuser;Password=authsecret;"
    ports:
      - "5050:5000"
    depends_on:
      - usersdb

  usersdb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: usersdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authsecret
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
      - ./AuthenticationService/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  

volumes:
  auth_db_data:
